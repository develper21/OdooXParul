name: CI - Pipeline

on:
  push:
  pull_request:

jobs:
  validate:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend and backend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test server and frontend
        run: npm test

      - name: Build production application
        run: npm run build